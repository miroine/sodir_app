<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SODIR field layer map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <style>
    body { margin: 0; font: 14px Arial, sans-serif; background: #eef3f8; color: #172b43; }
    #map { height: 520px; background: #cbdde9; border-radius: 14px; }
    #status { padding: 8px 12px; min-height: 20px; }
    .dark { background: #142238; color: #ecf2fa; }
    .dark .leaflet-control-layers, .dark .leaflet-control-attribution {
      background: #142238; color: #ecf2fa;
    }
    .leaflet-control-layers { max-height: 300px; overflow-y: auto; }
    .leaflet-control-layers label { line-height: 1.8; }
    .field-context-label, .selected-field-label {
      color: #102a43; background: rgba(255,255,255,0.9); border-radius: 3px;
      padding: 2px 4px; font-size: 10px; white-space: nowrap; width: max-content !important;
    }
    .selected-field-label { background: #ffe2aa; font-size: 12px; border: 1px solid #a56800; }
    .map-actions { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .map-actions button { padding: 7px 12px; cursor: pointer; }
    .dark .leaflet-popup-content-wrapper, .dark .leaflet-popup-tip {
      background: #142238; color: #ecf2fa;
    }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Interactive SODIR field map"></div>
  <div class="map-actions">
    <button id="export" disabled>Export drawings (GeoJSON)</button>
    <span>Line: distance · polygon/rectangle: area · circle: radius and area. Edit/delete with the toolbar.</span>
  </div>
  <div id="status" role="status" aria-live="polite">Loading map… If it does not load, use the official FactMaps link.</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script>
    const data = __MAP_DATA__;
    const status = document.getElementById("status");
    if (data.provider === "NSTA") document.getElementById("map").style.height = "610px";
    document.title = data.provider + " field outline map";
    document.getElementById("map").setAttribute("aria-label", "Interactive " + data.provider + " field map");
    if (data.dark) document.body.classList.add("dark");
    if (!window.L) {
      status.textContent = "Map library unavailable. Use the official FactMaps link.";
    } else {
      try {
        const storageKey = "sodir-map-state";
        let saved = null;
        let storageError = "";
        try {
          const previous = JSON.parse(sessionStorage.getItem(storageKey) || "null");
          if (data.state_id && previous && previous.id === data.state_id) saved = previous;
          else sessionStorage.removeItem(storageKey);
        } catch (error) {
          storageError = " Browser storage is unavailable; map settings cannot be retained. Export sketches before leaving.";
        }
        const map = L.map("map", {scrollWheelZoom: false}).setView([64, 5], 5);
        if (data.provider === "NSTA") map.attributionControl.addAttribution("Field and infrastructure data © NSTA");
        const osmCredit = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
        const cartoCredit = osmCredit + ' © <a href="https://carto.com/attributions">CARTO</a>';
        const basemaps = {
          "Street": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18, attribution: osmCredit,
          }),
          "Light": L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", {
            maxZoom: 18, attribution: cartoCredit,
          }),
          "Gray": L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png", {
            maxZoom: 18, attribution: cartoCredit,
          }),
          "Dark": L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", {
            maxZoom: 18, attribution: cartoCredit,
          }),
          "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
            maxZoom: 18, attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
          }),
          "Ocean / bathymetry": L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}", {
            maxNativeZoom: 10, maxZoom: 18,
            attribution: "Ocean basemap © Esri, GEBCO, NOAA and contributors — not for navigation",
          }),
        };
        basemaps[saved && basemaps[saved.basemap] ? saved.basemap : (data.dark ? "Dark" : data.provider === "NSTA" ? "Ocean / bathymetry" : "Light")].addTo(map);
        const reportError = () => {
          status.textContent = "Some map tiles are unavailable. Try another basemap in Layers; source geometry remains visible.";
        };
        Object.values(basemaps).forEach((layer) => layer.on("tileerror", reportError));
        const overlays = {};
        data.layers.forEach((layer) => {
          const overlay = L.tileLayer.wms(data.wms, {
            layers: layer.name, version: "1.3.0", format: "image/png", transparent: true,
            attribution: "© Sokkeldirektoratet", maxZoom: 18,
          }).addTo(map);
          overlay.on("tileerror", reportError);
          overlays[layer.title + " (" + layer.name.replace(/[<>&"']/g, "") + ")"] = overlay;
        });
        (data.context || []).forEach((item) => {
          const group = L.featureGroup().addTo(map);
          item.features.forEach((feature) => {
            const geometry = feature.geometry;
            const attributes = feature.attributes || {};
            const title = attributes.FIELDNAME || attributes.PIPE_NAME || attributes.NAME || attributes.WELLREGNO || item.title;
            const popup = document.createElement("div");
            const heading = document.createElement("strong");
            heading.textContent = title;
            popup.appendChild(heading);
            Object.entries(attributes).forEach(([key, value]) => {
              if (value === null || value === "") return;
              const row = document.createElement("div");
              row.textContent = key + ": " + value;
              popup.appendChild(row);
            });
            const source = document.createElement("a");
            source.textContent = "NSTA source";
            source.href = item.source;
            source.target = "_blank";
            source.rel = "noopener noreferrer";
            popup.appendChild(source);
            let layer;
            if (geometry.rings) {
              layer = L.polygon(geometry.rings.map(ring => ring.map(p => [p[1], p[0]])),
                {color: item.color, weight: 2, fillOpacity: 0.18});
            } else if (geometry.paths) {
              layer = L.polyline(geometry.paths.map(path => path.map(p => [p[1], p[0]])),
                {color: item.color, weight: 2, opacity: 0.85});
            } else {
              layer = L.circleMarker([geometry.y, geometry.x],
                {color: "#ffffff", weight: 1, fillColor: item.color, fillOpacity: 0.9,
                 radius: item.title === "Wellbores" ? 3 : 6});
            }
            layer.bindPopup(popup);
            const tooltip = document.createElement("span");
            tooltip.textContent = title;
            layer.bindTooltip(tooltip, {sticky: true});
            layer.addTo(group);
            if (geometry.rings && feature.centroid) {
              const label = document.createElement("span");
              label.textContent = title;
              L.marker([feature.centroid.y, feature.centroid.x], {
                icon: L.divIcon({html: label, className: "field-context-label", iconSize: [100, 18]}),
                interactive: false,
              }).addTo(group);
            }
          });
          overlays[item.title] = group;
        });
        const selected = L.featureGroup().addTo(map);
        const label = document.createElement("span");
        label.textContent = data.field;
        data.geometry.lines.forEach((line) => {
          L.polyline(line, {color: "#f6a623", weight: 4}).bindTooltip(label.cloneNode(true)).addTo(selected);
        });
        if (data.provider === "NSTA" && selected.getBounds().isValid()) {
          const badge = document.createElement("strong");
          badge.textContent = data.field;
          L.marker(selected.getBounds().getCenter(), {
            icon: L.divIcon({html: badge, className: "selected-field-label", iconSize: [140, 22]}),
            interactive: false,
          }).addTo(selected);
        }
        data.geometry.points.forEach((point) => {
          L.circleMarker(point, {color: "#f6a623", radius: 8}).bindTooltip(label.cloneNode(true)).addTo(selected);
        });
        overlays["Selected field boundary / location"] = selected;
        const drawings = L.featureGroup().addTo(map);
        overlays["Your drawings"] = drawings;
        const drawingFeatures = () => {
          const features = [];
          drawings.eachLayer((layer) => {
            const feature = layer.toGeoJSON();
            feature.properties = {
              field: data.field,
              source: data.provider,
              shape: layer instanceof L.Circle ? "circle" : layer instanceof L.Rectangle ? "rectangle" : "geometry",
              ...(layer instanceof L.Circle ? {radius_m: layer.getRadius()} : {}),
            };
            features.push(feature);
          });
          return features;
        };
        const saveState = () => {
          if (!data.state_id) return;
          try {
            const center = map.getCenter();
            sessionStorage.setItem(storageKey, JSON.stringify({
              id: data.state_id, center: [center.lat, center.lng], zoom: map.getZoom(),
              basemap: Object.keys(basemaps).find((key) => map.hasLayer(basemaps[key])),
              overlays: Object.fromEntries(Object.entries(overlays).map(([key, layer]) => [key, map.hasLayer(layer)])),
              features: drawingFeatures(),
            }));
          } catch (error) {
            storageError = " Browser storage is unavailable; map settings cannot be retained. Export sketches before leaving.";
            status.textContent = storageError;
          }
        };
        L.control.layers(basemaps, overlays).addTo(map);
        L.control.scale({imperial: false}).addTo(map);
        const drawingAvailable = L.Control.Draw && L.GeometryUtil;
        if (drawingAvailable) {
          const exportButton = document.getElementById("export");
          const measurements = (layer) => {
            if (layer instanceof L.Circle) {
              const radius = layer.getRadius();
              return {shape: "circle", radius_m: radius, area_m2: Math.PI * radius * radius};
            }
            if (layer instanceof L.Polygon) {
              const points = layer.getLatLngs()[0];
              return {shape: "polygon", area_m2: L.GeometryUtil.geodesicArea(points)};
            }
            if (layer instanceof L.Polyline) {
              const points = layer.getLatLngs();
              let distance = 0;
              for (let i = 1; i < points.length; i++) distance += map.distance(points[i - 1], points[i]);
              return {shape: "line", distance_m: distance};
            }
            return {shape: "marker"};
          };
          const updateMeasurement = (layer) => {
            const values = measurements(layer);
            let label;
            if (values.shape === "circle") {
              label = `Radius ${(values.radius_m / 1000).toFixed(2)} km · approximate area ${(values.area_m2 / 1e6).toFixed(2)} km²`;
            } else if (values.shape === "polygon") {
              label = `Area ${(values.area_m2 / 1e6).toFixed(2)} km²`;
            } else if (values.shape === "line") {
              label = `Distance ${(values.distance_m / 1000).toFixed(2)} km`;
            } else {
              const point = layer.getLatLng();
              label = `${point.lat.toFixed(5)}° N, ${point.lng.toFixed(5)}° E`;
            }
            if (layer.getTooltip()) layer.setTooltipContent(label);
            else layer.bindTooltip(label, {permanent: true});
            if (layer.getPopup()) layer.setPopupContent(label);
            else layer.bindPopup(label);
          };
          if (saved && saved.features) {
            saved.features.forEach((feature) => {
              let layer;
              if (feature.properties.shape === "circle") {
                const point = feature.geometry.coordinates;
                layer = L.circle([point[1], point[0]], {radius: feature.properties.radius_m});
              } else if (feature.properties.shape === "rectangle") {
                const points = feature.geometry.coordinates[0].map((point) => [point[1], point[0]]);
                layer = L.rectangle(L.latLngBounds(points));
              } else {
                layer = L.geoJSON(feature).getLayers()[0];
              }
              drawings.addLayer(layer);
              updateMeasurement(layer);
            });
            exportButton.disabled = drawings.getLayers().length === 0;
          }
          map.addControl(new L.Control.Draw({
            position: "topleft",
            edit: {featureGroup: drawings},
            draw: {
              polyline: {metric: true, feet: false},
              polygon: {allowIntersection: false, showArea: true, metric: true},
              rectangle: {showArea: true, metric: true},
              circle: {showRadius: true, metric: true, feet: false},
              marker: {}, circlemarker: false,
            },
          }));
          map.on(L.Draw.Event.CREATED, (event) => {
            drawings.addLayer(event.layer);
            updateMeasurement(event.layer);
            exportButton.disabled = false;
            saveState();
          });
          map.on(L.Draw.Event.EDITED, (event) => {
            event.layers.eachLayer(updateMeasurement);
            saveState();
          });
          map.on(L.Draw.Event.DELETED, () => {
            exportButton.disabled = drawings.getLayers().length === 0;
            saveState();
          });
          exportButton.onclick = () => {
            const collection = {type: "FeatureCollection", features: []};
            drawings.eachLayer((layer) => {
              const feature = layer.toGeoJSON();
              feature.properties = {...measurements(layer), field: data.field};
              collection.features.push(feature);
            });
            const url = URL.createObjectURL(new Blob([JSON.stringify(collection, null, 2)], {type: "application/geo+json"}));
            const link = document.createElement("a");
            link.href = url;
            link.download = "field_map_drawings.geojson";
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          };
        }
        const bounds = selected.getBounds();
        if (saved && saved.center) map.setView(saved.center, saved.zoom);
        else if (data.context_bounds) {
          const box = data.context_bounds;
          map.fitBounds([[box[1], box[0]], [box[3], box[2]]], {padding: [15, 15]});
        } else if (bounds.isValid()) map.fitBounds(bounds, {padding: [45, 45], maxZoom: 11});
        if (saved && saved.overlays) {
          Object.entries(overlays).forEach(([key, layer]) => {
            if (saved.overlays[key] === false) map.removeLayer(layer);
          });
        }
        map.on("moveend baselayerchange overlayadd overlayremove", saveState);
        saveState();
        const home = L.control({position: "topleft"});
        home.onAdd = () => {
          const button = L.DomUtil.create("button", "leaflet-bar");
          button.textContent = "⌖ Field";
          button.title = "Recenter on selected field";
          button.style.padding = "8px";
          L.DomEvent.disableClickPropagation(button);
          button.onclick = () => { if (bounds.isValid()) map.fitBounds(bounds, {padding: [45, 45], maxZoom: 11}); };
          return button;
        };
        home.addTo(map);
        if (data.provider === "NSTA") {
          if (data.context_bounds) {
            const contextControl = L.control({position: "topleft"});
            contextControl.onAdd = () => {
              const button = L.DomUtil.create("button", "leaflet-bar");
              button.textContent = "Nearby area";
              button.style.padding = "8px";
              L.DomEvent.disableClickPropagation(button);
              button.onclick = () => {
                const box = data.context_bounds;
                map.fitBounds([[box[1], box[0]], [box[3], box[2]]], {padding: [15, 15]});
              };
              return button;
            };
            contextControl.addTo(map);
          }
          const regional = L.control({position: "topleft"});
          regional.onAdd = () => {
            const button = L.DomUtil.create("button", "leaflet-bar");
            button.textContent = "North Sea";
            button.title = "Show the North Sea and surrounding coastlines";
            button.style.padding = "8px";
            L.DomEvent.disableClickPropagation(button);
            button.onclick = () => map.setView([57, 0], 5);
            return button;
          };
          regional.addTo(map);
        }
        status.textContent = drawingAvailable
          ? "Selected field highlighted in amber. Measurements are approximate, not for navigation. Map settings and sketches are kept in this browser tab until the field changes. Export for a permanent copy." + storageError
          : "Map loaded, but drawing tools are unavailable. Reload to retry the drawing library." + storageError;
      } catch (error) {
        status.textContent = "Unable to render this map. Use the official FactMaps link.";
      }
    }
  </script>
</body>
</html>
